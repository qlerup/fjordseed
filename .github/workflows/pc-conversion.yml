name: PC conversion
on:
  push:
    paths:
      - '*conversion*'
      - 'remote_*.py'
      - 'converter_worker.py'
      - 'conversion_media.py'
      - 'conversion_decoder.py'
      - 'qbit_worker.py'
      - 'desktop-converter/**'
      - 'tests/test_remote*'
      - 'tests/test_conversion.py'
      - 'tests/test_library_conversion.py'
      - 'tests/test_library_qbit_native.py'
      - '.github/workflows/pc-conversion.yml'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_remote_conversion.py tests/test_remote_upload_transport.py tests/test_remote_helper.py tests/test_conversion.py tests/test_conversion_phases.py tests/test_bitrate_gate.py tests/test_library_conversion.py tests/test_moved_content.py tests/test_worker.py tests/test_shared_library.py tests/test_benefits_lock_order.py desktop-converter/test_parity.py desktop-converter/test_nvidia_decoder.py desktop-converter/test_shared_runner.py desktop-converter/test_remote_agent.py desktop-converter/test_drive_ui.py desktop-converter/test_installer.py
