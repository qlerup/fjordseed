name: Notification tests
on:
  push:
    paths:
      - 'event_notifier.py'
      - 'app.py'
      - 'Dockerfile'
      - 'tests/test_event_notifier.py'
      - '.github/workflows/notifications.yml'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py event_notifier.py
      - run: pytest -q tests/test_event_notifier.py
