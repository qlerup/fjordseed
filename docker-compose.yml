name: fjordseed-hub
services:
  app:
    build: .
    image: fjordseed-app:local
    container_name: ${CONTAINER_NAME:-fjordseed}
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "${APP_PORT:-8099}:8088"
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      FJORDSEED_DATA: /data
      FJORDVPN_CONTAINER: ${FJORDVPN_CONTAINER:-fjordvpn}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UI_ALLOWED_HOSTS: ${UI_ALLOWED_HOSTS:-}
      FJORDHUB_URL: ${FJORDHUB_URL:-}
      FJORDHUB_API_KEY: ${FJORDHUB_API_KEY:-}
      FJORDHUB_APP_ID: fjordseed
    volumes:
      - "${DATA_DIR:?Choose DATA_DIR}:/data"
      - "${DOWNLOADS_DIR:?Choose DOWNLOADS_DIR}:/downloads"
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
