<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FjordSeed · Login</title><link rel="stylesheet" href="/static/style.css"><link rel="icon" href="/static/icon.svg"><link rel="stylesheet" href="/static/interface.css?v=classy-20261025"></head><body class="login"><main class="login-panel"><a class="brand" href="/"><img src="/static/icon.svg" alt="">FjordSeed</a><h1>Velkommen tilbage</h1><p class="muted">{{ 'Log ind med din FjordHub-administrator.' if managed else 'Log ind for at administrere din seedbox.' }}</p>{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}<form method="post">
{% if email_required %}<div class="auth-field"><label for="first-login-email">Email til din FjordHub-konto</label><input id="first-login-email" name="first_login_email" type="email" autocomplete="email" required autofocus value="{{ request.form.get('first_login_email', '') }}"></div>{% endif %}{% if password_required %}<div class="auth-field"><label for="first-login-password">Ny personlig adgangskode</label><input id="first-login-password" name="first_login_password" type="password" autocomplete="new-password" minlength="6" maxlength="128" required></div><div class="auth-field"><label for="first-login-password-confirm">Gentag ny adgangskode</label><input id="first-login-password-confirm" name="first_login_password_confirm" type="password" autocomplete="new-password" minlength="6" maxlength="128" required></div>{% endif %}
<input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Brugernavn<input name="username" autocomplete="username" required></label><label>Adgangskode<input type="password" name="password" autocomplete="current-password" required></label><button class="primary">Log ind</button></form></main></body></html>
