<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FjordSeed · Login</title><link rel="stylesheet" href="/static/style.css"><link rel="icon" href="/static/icon.svg"></head><body class="login"><main class="login-panel"><a class="brand" href="/"><img src="/static/icon.svg" alt="">FjordSeed</a><h1>Velkommen tilbage</h1><p class="muted">{{ 'Log ind med din FjordHub-administrator.' if managed else 'Log ind for at administrere din seedbox.' }}</p>{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Brugernavn<input name="username" autocomplete="username" required></label><label>Adgangskode<input type="password" name="password" autocomplete="current-password" required></label><button class="primary">Log ind</button></form></main></body></html>
