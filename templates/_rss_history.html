<dialog id="rss-history-dialog" aria-labelledby="rss-history-title">
<div class="dialog-heading"><h2 id="rss-history-title">Hentede titler</h2><button type="button" class="close quiet" aria-label="Luk historik">×</button></div>
<div class="dialog-body">
<p class="muted small">Titler og krediteret upload gemmes, også efter torrenten eller filerne er slettet. Listen viser downloads, som feedet har startet. Tidligere slettede torrents kan mangle i historikken.</p>
<p id="rss-history-status" class="muted small" role="status"></p>
<ul id="rss-history-list" aria-label="Hentede titler og krediteret upload"></ul>
</div>
<div class="dialog-footer"><button type="button" class="secondary close">Luk</button></div>
</dialog>
