{% macro conversion_fields(prefix) %}
<fieldset class="conversion-choice" id="{{ prefix }}-conversion-box">
 <legend>Konvertering</legend>
 <label class="check-label"><input type="checkbox" id="{{ prefix }}-convert"> Konvertér video før den gemmes i biblioteket</label>
 <p id="{{ prefix }}-conversion-hint" class="muted small" role="status">Henter konverteringsindstillinger…</p>
 <p class="muted small" id="{{ prefix }}-conversion-policy" hidden>Originalen seeder i bufferen. Kun den konverterede udgave flyttes til biblioteket. Originalen slettes efter godkendt konvertering og ratio 1:1 eller 49 timers seeding. Ved fejl beholdes den.</p>
</fieldset>
{% endmacro %}
