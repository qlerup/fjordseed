<section id="tracker-insights" class="insights" aria-labelledby="insights-title" hidden>
  <div class="insights-heading">
    <div class="insights-identity"><p class="insights-eyebrow">DIN TRACKER · UDVIKLING OVER TID</p><h3 id="insights-title">Din tracker</h3><p id="insights-account-status" class="muted small"></p></div>
    <div class="insights-controls">
      <label class="insights-account"><span class="sr-only">Trackerkonto til grafen</span><select id="insights-account"></select></label>
      <div class="insights-period" role="group" aria-label="Grafens periode"><button type="button" data-days="1" aria-pressed="false">24 t.</button><button type="button" data-days="7" aria-pressed="true">7 dage</button><button type="button" data-days="30" aria-pressed="false">30 dage</button></div>
    </div>
  </div>

  <div class="insights-viewport"><div class="insights-cube"><div class="insights-face insights-current"></div><div class="insights-face insights-next" aria-hidden="true" inert></div></div></div>
  <div class="insights-bottom"><div class="insights-tabs" role="group" aria-label="Vælg graf"></div><span class="insights-mode"><i aria-hidden="true"></i><span>Automatisk</span></span></div>
