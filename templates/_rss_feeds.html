<dialog id="rss-feeds-dialog" aria-labelledby="rss-feeds-title">
  <div class="dialog-heading">
    <div><h2 id="rss-feeds-title">Dine RSS-feeds</h2><p class="muted small">Styr automatisk hentning, feedregler og historik.</p></div>
    <button type="button" class="close quiet" aria-label="Luk feedlisten">×</button>
  </div>
  <div class="dialog-body">
    <div class="rss-feeds-toolbar"><p class="muted small" id="rss-feeds-summary"></p><button type="button" class="primary" id="rss-feeds-add">＋ Tilføj RSS-feed</button></div>
    <div id="rss-feed-list"><p class="muted">Henter feeds…</p></div>
  </div>
  <div class="dialog-footer"><button type="button" class="secondary close">Luk</button></div>
</dialog>
